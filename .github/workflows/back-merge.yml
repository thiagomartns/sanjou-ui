name: Back-merge

# Opens a `main` → `develop` PR after each release so the version bump and CHANGELOG reach
# `develop`. A maintainer merges it with a merge commit (never squash); conflicts, rare but
# possible after a hotfix, need a human. Uses the GitHub App token: PRs opened with
# GITHUB_TOKEN do not trigger the CI checks the `develop` ruleset requires.
on:
  release:
    types: [published]

permissions: {}

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Open the back-merge PR unless one is already open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          existing=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Back-merge PR #$existing is already open."
            exit 0
          fi
          gh pr create --base develop --head main \
            --title "chore: back-merge $TAG into develop" \
            --body "Brings the $TAG version bump and CHANGELOG back to \`develop\`. Merge with a merge commit, never squash."
