name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tokens are up to date and pass contrast
        run: pnpm tokens:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Install Playwright browser (Storybook tests)
        run: pnpm --filter www exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
