name: Release

# release-please keeps a Release PR open against `main` (ADRs 0003 and 0004). Merging it tags
# vX.Y.Z, creates the GitHub Release and publishes @sanjou/tokens and @sanjou/ui to npm.
# The Release is created with the GitHub App token, not GITHUB_TOKEN, so `release: published`
# workflows (site.yml, storybook.yml, back-merge.yml) are triggered by it.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing (ADR 0012): npm trades the job's OIDC token for a short-lived publish
      # token and adds provenance on its own. It needs npm >= 11.5.1; pnpm 10 has no OIDC support,
      # so pnpm only packs (resolving `workspace:` ranges) and npm publishes the tarballs.
      - run: npm install --global npm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Tokens are up to date and pass contrast
        run: pnpm tokens:check
      - run: pnpm turbo run build --filter="./packages/*"
      - name: Pack
        run: pnpm -r --filter "./packages/*" pack --pack-destination "$RUNNER_TEMP/pack"
      # Versions already on npm are skipped, so re-running this job is safe.
      - name: Publish ${{ needs.release-please.outputs.tag_name }}
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
              continue
            fi
            tarball="$RUNNER_TEMP/pack/$(echo "${name#@}" | tr / -)-$version.tgz"
            npm publish "$tarball" --access public
          done
