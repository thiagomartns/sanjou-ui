name: Storybook

# Production deploys only on a release (ADR 0005), so the published Storybook always matches a tag.
# The release event only fires when the release is created with a token other than GITHUB_TOKEN
# (release-please runs with a GitHub App token). A manual run must pick a `v*` tag as its ref.
# Temporary exception until 0.1.0 (ADR 0005): every push to develop also deploys. Remove `push` then.
on:
  release:
    types: [published]
  push:
    branches: [develop]
    paths:
      - 'apps/www/**'
      - 'packages/tokens/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter www build-storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/www/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
